name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Gradle compile
        run: ./gradlew :app:compileDebugKotlin --stacktrace

  brokerbridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: native/brokerbridge/go.sum
      - name: Verify module
        working-directory: native/brokerbridge
        run: |
          go mod download
          go test ./...
          go vet ./...
      - name: Ensure release pin
        working-directory: native/brokerbridge
        run: |
          grep -Eq 'github.com/openrung/openrung/brokerapi v0\.6\.1([[:space:]]|$)' go.mod
