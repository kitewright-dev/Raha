name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle compile
        run: gradle :app:compileDebugKotlin --stacktrace

  brokerbridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/brokerbridge/go.mod
          cache: false
      - name: Resolve and verify module
        working-directory: native/brokerbridge
        run: |
          go mod tidy
          go test ./...
          go vet ./...
          git diff --exit-code -- go.mod
      - name: Ensure release pin
        working-directory: native/brokerbridge
        run: |
          grep -Eq 'github.com/openrung/openrung/brokerapi v0\.6\.1([[:space:]]|$)' go.mod
